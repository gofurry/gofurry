name: Update README cards

on:
  schedule:
    # UTC 03:00 / UTC+8 11:00
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare profile directory
        run: mkdir -p profile

      # ------------------------------------------------------------
      # GitHub Stats
      # ------------------------------------------------------------

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: "username=gofurry&show_icons=true&theme=gruvbox"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ------------------------------------------------------------
      # Top Languages
      # ------------------------------------------------------------

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: "username=gofurry&layout=compact&theme=gruvbox&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ------------------------------------------------------------
      # 3D Contribution Calendar
      # Night Rainbow
      # ------------------------------------------------------------

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: gofurry

      - name: Keep Night Rainbow version
        shell: bash
        run: |
          set -euo pipefail

          source_file="profile-3d-contrib/profile-night-rainbow.svg"
          target_file="profile/night-rainbow.svg"

          if [ ! -f "$source_file" ]; then
            echo "::error::Night Rainbow contribution SVG was not generated."
            exit 1
          fi

          cp "$source_file" "$target_file"

          # We only want the Night Rainbow version in the repository.
          rm -rf profile-3d-contrib

          echo "Night Rainbow contribution calendar generated successfully."

      # ------------------------------------------------------------
      # Commit generated SVG files
      # ------------------------------------------------------------

      - name: Commit README cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            profile/stats.svg \
            profile/top-langs.svg \
            profile/night-rainbow.svg

          if git diff --cached --quiet; then
            echo "No README card changes."
            exit 0
          fi

          git commit -m "Update README cards"
          git push
